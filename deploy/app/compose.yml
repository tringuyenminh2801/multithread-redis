# App stack: runs on every host that serves the redis server.
# Ships logs and metrics to the monitoring stack at LOKI_URL / MIMIR_URL,
# so the monitoring stack can be on this host or a separate one.
#
#   cp .env.example .env   # then edit
#   docker compose up -d

name: redis-app

services:
  redis:
    image: ${IMAGE:-multithreaded-redis:local}
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    environment:
      REDIS_PORT: ":6379"
      REDIS_METRICS_ADDR: ":2112"
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-100000}
      REDIS_MAX_WAITING_CONNS: ${REDIS_MAX_WAITING_CONNS:-10000}
      REDIS_BUFFER_SIZE: ${REDIS_BUFFER_SIZE:-2048}
      REDIS_LOG_LEVEL: ${REDIS_LOG_LEVEL:-info}
    # :2112 (metrics) is deliberately not published; Alloy scrapes it on the compose network.

  alloy:
    image: grafana/alloy:v1.21.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: ${LOKI_URL:?set LOKI_URL in .env}
      MIMIR_URL: ${MIMIR_URL:?set MIMIR_URL in .env}
      HOST_NAME: ${HOST_NAME:-local}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    extra_hosts:
      # Lets LOKI_URL / MIMIR_URL use host.docker.internal when monitoring runs on this host (Linux).
      - "host.docker.internal:host-gateway"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro

volumes:
  alloy-data:
